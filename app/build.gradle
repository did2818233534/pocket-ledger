plugins { id 'com.android.application' }
android {
    namespace 'cn.guga.ledger'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.guga.ledger.smart'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.5.4'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation files('../build/tailscale/mobile.aar') }

dependencies { implementation fileTree(dir: 'libs', include: ['*.jar']) }

// The application credential is injected locally, never committed to source control.
tasks.named('preBuild').configure {
    doFirst {
        if (!file('src/main/assets/ocr-api.json').isFile()) {
            throw new GradleException('Missing OCR API credential; see ocr/api/README.md')
        }
    }
}
