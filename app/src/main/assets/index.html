<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"><title>小账</title><link rel="stylesheet" href="style.css"></head><body><main id="app"></main><nav id="nav"><button data-page="ledger">▤<span>账本</span></button><button data-page="stats">◔<span>统计</span></button><button data-page="sync">⇄<span>同步</span></button></nav><button id="add" aria-label="记一笔">＋</button><dialog id="editor"><form id="entry-form"><div class="sheet-head"><h2 id="edit-title">记一笔</h2><button type="button" id="cancel" class="text-button">取消</button></div><label>支出金额（元）<input id="amount" type="text" inputmode="decimal" placeholder="0.00" required maxlength="12" autocomplete="off"></label><label>支出时间<input id="at" type="datetime-local" required></label><label>支出属性<select id="category"><option value="daily">日常生活</option><option value="extra">额外支出</option><option value="claim">报销垫付</option></select></label><label>备注<input id="note" maxlength="200" placeholder="记下这笔钱花在哪里"></label><p id="form-error" role="alert"></p><button class="primary" type="submit">保存到手机</button><button type="button" id="delete" class="danger">删除这笔记录</button></form></dialog><div id="toast" role="status"></div><script src="model.js"></script><script src="app.js"></script></body></html>
